<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="transitions.js"></script>
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="videos/projectsbackground.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('bg-video');
        video.playbackRate = 1;
    </script>
    <div class="overlay"></div>

    <div class="content">
        <div class="projects-section">
            <div class="neon-button-wrapper" id="neon-container"></div>
        </div>

        <div class="projects-container">
            <div class="project-list">
                <a href="#" class="button-card" onclick="showProject('Project 1')">Violet</a>
                <a href="#" class="button-card" onclick="showProject('Project 2')">Fractals</a>
                <a href="#" class="button-card" onclick="showProject('Project 3')">Table</a>
                <a href="#" class="button-card" onclick="showProject('Project 4')">List</a>
                <a href="#" class="button-card" onclick="showProject('Project 5')">Future Project</a>
                <a href="#" class="button-card" onclick="showProject('Project 6')">Future Project</a>
                <a href="#" class="button-card" onclick="showProject('Project 7')">Future Project</a>
                <a href="#" class="button-card" onclick="showProject('Project 8')">Future Project</a>
                <a href="#" class="button-card" onclick="showProject('Project 9')">Future Project</a>
                <a href="#" class="button-card" onclick="showProject('Project 10')">Future Project</a>
            </div>
            <div class="project-details-wrapper">
                <div class="project-details" id="project-details">
                    <h2>Select a project to see details</h2>
                </div>
            </div>
        </div>
    </div>

    <script>
        const projectData = {
            "Project 1": {
                title: "<a href='https://github.com/bluelijah/Violet' target='_blank'>Violet</a>",
                description: ["Violet is a personalized course creator and teacher originally created for the UC Merced Hackathon, winning 3rd place!<br><br>",
                "Written primariliy in JavaScript and Python, and conjoined with Fast API, and public Google Gemini API, Violet utilizes some of the newest software available to create a personalized course for any subject you want to learn.",
                "The intent of the projct was to create a tool for thos that love learning.",
                "My friends and I knew we were part of the target audience; consequentially, we were able to think like the user, and create something truly effective at assiting learning.<br><br>",
            ].join(" "),
            cover: "Cover page preview will go here",
            image: "images/hackathon.jpeg"
            }, 
            "Project 2": {
                title: "<a href='https://github.com/bluelijah/MandelbrotFractal' target='_blank'>Fractals</a>",
                description: ["This personal project has been directly inspired by the intriguing nature of mathematical symmetry.",
                "The fractals produced by virtue of mathematical iteration are not only visually captivating, but they also embody the concept of infinity in a tangible way.",
                "By leveraging Python's Tkinter library, I was able to create a graphical user interface that allows users to explore the Mandelbrot set interactively.",
                "This project serves as a bridge between abstract mathematical concepts and visual representation.<br><br>",
            ].join(" "),
            cover: `<div style="border-radius: 12px; overflow: hidden; width: 100%; height: 250px;">
                        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vR0mVkHD6J1Zo3z9nIJg2pKEBU6Dohi513KCU0VQ2cDLmZNeE6ZYhJt1AtGSPxmyMa6srf0Sq-5pWrd/pubembed?start=true&loop=false&delayms=10000" 
                        frameborder="0" 
                        width="100%"
                        height="100%" 
                        allowfullscreen="true" 
                        mozallowfullscreen="true" 
                        webkitallowfullscreen="true">"
                        </iframe>
                </div>`
            ,
            image: "images/fractalswithinmandelbrot.jpg"
            },
            "Project 3": {
                title: "<a href='https://github.com/bluelijah/TableProject' target='_blank'>Table</a>",
                description: [
                    "This project demonstrates structured data with a table.<br><br>"
                ].join(" "),
                cover: `
                    <div class="project-table">
                        <h3>Project Highlights</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Feature</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Feature 1</td>
                                    <td>Interactive data visualizations</td>
                                </tr>
                                <tr>
                                    <td>Feature 2</td>
                                    <td>Responsive and user-friendly layout</td>
                                </tr>
                                <tr>
                                    <td>Feature 3</td>
                                    <td>Clean design matching website aesthetic</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `,
                image:""
            },
            "Project 4": {
                title: "<a href='https://github.com/bluelijah/TableProject' target='_blank'>List</a>",
                description: [
                    "This highlights key points in a list format.<br><br>"
                ].join(" "),
                cover: `
                    <div class="project-list-style">
                        <h3>Key Learnings</h3>
                        <ul>
                            <li>Planning data structure for readability</li>
                            <li>Styling tables and lists for visual clarity</li>
                            <li>Integrating structured content with existing website theme</li>
                            <li>Writing semantic HTML and reusable CSS</li>
                        </ul>
                    </div>
                `,
                image:""
            },
        };

        function showProject(name) {
            const details = document.getElementById('project-details');
            const project = projectData[name];
            details.innerHTML = `   
                <h2>${project.title}</h2>
                <div class="project-text">${project.description}</div>
                <div class="project-visuals">
                    <div class="project-cover">${project.cover}</div>
                    <img class="project-image" src="${project.image}">
                </div>
            `;
        }

        const container = document.getElementById("neon-container");
        const text = "Yes I have a cool neon sign styled home button, no it wasn't easy to make, but it's the little things that matter";
        const repeatCount = 5; 

        for (let i = 0; i < repeatCount; i++) {
            const a = document.createElement("a");
            a.href = "index.html";
            a.className = "neon-button";
            a.textContent = text;
            container.appendChild(a);
        }
    </script>
</body>
</html>
