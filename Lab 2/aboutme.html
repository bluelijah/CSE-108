<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="typewriterscript.js"></script>
    <script src="transitions.js"></script>
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="videos/aboutmebackground.mp4" type="video/mp4">
    </video>
    <header class="navbar">
        <nav class="navbar-content">
            <a href="index.html" class="nav-link">Home</a>
            <a href="aboutme.html" class="nav-link">About Me</a>
            <a href="resume.pdf" target="_blank" class="nav-link">Resume</a>
            <a href="engineeringprojects.html" class="nav-link">Engineering Projects</a>
            <a href="philosophyprojects.html" class="nav-link">Philosophy Projects</a>
        </nav>
    </header>
    <div class="content">
        <h2 style="text-align: left;">
            <span id="aboutmecontent">
                <span class="typing-text"></span>
            </span>
        </h2>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">×</button>
            <h3 class="modal-title" id="modal-title">Dot Content</h3>
            <div id="modal-text">
                <p>This is the content for the clicked dot.</p>
            </div>
        </div>
    </div>

    <div class="dots-container">
        <div class="staggered-dot"></div>
        <div class="staggered-dot"></div>
        <div class="staggered-dot"></div>
        <div class="staggered-dot"></div>
        <div class="staggered-dot"></div>
        <div class="staggered-dot"></div>
        <div class="staggered-dot"></div>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        video.playbackRate = 1;

        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modal-close');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');

        function openModal(dotIndex) {
            const dotContent = [
                { title: "Dot 1", content: "<p>Content for the first dot goes here.</p>" },
                { title: "Dot 2", content: "<p>Content for the second dot goes here.</p>" },
                { title: "Dot 3", content: "<p>Content for the third dot goes here.</p>" },
                { title: "Dot 4", content: "<p>Content for the fourth dot goes here.</p>" },
                { title: "Dot 5", content: "<p>Content for the fifth dot goes here.</p>" },
                { title: "Dot 6", content: "<p>Content for the sixth dot goes here.</p>" },
                { title: "Dot 7", content: "<p>Content for the seventh dot goes here.</p>" }
            ];

            modalTitle.textContent = dotContent[dotIndex].title;
            modalText.innerHTML = dotContent[dotIndex].content;
            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
        }

        modalClose.addEventListener('click', closeModal);

        // Close modal when clicking outside content
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        function showStaggeredDots() {
            const dots = document.querySelectorAll('.staggered-dot');
            
            dots.forEach((dot, index) => {
                setTimeout(() => {
                    dot.classList.add('show');
                    
                    // Add click event listener
                    dot.addEventListener('click', () => {
                        openModal(index);
                    });
                }, index * 500);
            });
        }
        
        setTimeout(showStaggeredDots, 26000); //26000
    </script>
    <div class="overlay"></div>
</body>
</html>
